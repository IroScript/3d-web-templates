<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>True 3D Spatial Article Reader · EXITO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "../three.module.min.js"
    }
  }
  </script>
</head>
<body>
  <!-- Hardware-Accelerated 3D WebGL Canvas Layer -->
  <div id="webgl-stage">
    <canvas id="spatial-canvas"></canvas>
  </div>

  <!-- Cosmic Ambient Glow Layer -->
  <div class="space-ambient-glow" id="space-ambient-glow"></div>

  <!-- Top Spatial HUD Bar -->
  <header id="spatial-hud-header">
    <div class="hud-left">
      <a href="../index.html" class="hud-return-btn" title="Return to 3D Card Grid">
        <span class="chevron">&lt;</span>
        <span class="btn-text">3D LIBRARY</span>
      </a>
      <div class="hud-divider"></div>
      <div class="article-info-pill">
        <span class="glow-indicator"></span>
        <span id="hud-article-title">THE ARCHITECTURE OF THOUGHT</span>
      </div>
    </div>

    <!-- 3D Spatial Mode Switcher -->
    <div class="hud-center">
      <div class="mode-switcher-tray" role="tablist">
        <button class="spatial-mode-btn active" data-mode="book" title="Physical 3D Cyber-Book with realistic curved page flip">
          <span class="mode-icon">📖</span>
          <span class="mode-name">3D Cyber-Book</span>
        </button>
        <button class="spatial-mode-btn" data-mode="ribbon" title="3D Curved Panoramic Ribbon wrapping around viewer">
          <span class="mode-icon">🌀</span>
          <span class="mode-name">Curved Ribbon</span>
        </button>
        <button class="spatial-mode-btn" data-mode="galaxy" title="Deep-Z Spatial Galaxy Flythrough across floating monoliths">
          <span class="mode-icon">🚀</span>
          <span class="mode-name">Deep-Z Galaxy</span>
        </button>
      </div>
    </div>

    <div class="hud-right">
      <button class="hud-action-pill" id="btn-toggle-audio" title="Toggle Procedural Spatial Audio">
        <span id="audio-icon">🔊</span>
        <span class="action-label" id="audio-label">SFX: ON</span>
      </button>
      <button class="hud-action-pill" id="btn-toggle-autorotate" title="Toggle Gentle 3D Auto-Orbit">
        <span id="orbit-icon">🔄</span>
        <span class="action-label">Orbit</span>
      </button>
      <button class="hud-action-pill" id="btn-reset-cam" title="Reset Camera View to Front">
        <span>🎯 Reset</span>
      </button>
    </div>
  </header>

  <!-- Interactive 3D Status & Gesture Hint -->
  <div id="spatial-hint-pill" class="spatial-hint-pill">
    <span class="hint-icon">✨</span>
    <span id="hint-message" class="hint-message">Drag to orbit book in 3D • Click Next/Prev or swipe to flip pages</span>
  </div>

  <!-- Bottom Thumb-Zone Controls (Mobile-First Ergonomics) -->
  <footer id="spatial-thumb-bar">
    <button class="thumb-nav-btn" id="btn-nav-prev" title="Previous Page or Chapter">
      <span class="btn-arrow">&lt;</span>
      <span class="btn-text">PREV</span>
    </button>

    <div class="thumb-progress-group">
      <span class="progress-chapter-badge" id="hud-chapter-badge">CH 01 / 05</span>
      <div class="progress-mini-track">
        <div class="progress-mini-fill" id="hud-progress-fill" style="width: 20%;"></div>
      </div>
      <span class="progress-detail" id="hud-page-detail">Page 1 of 5</span>
    </div>

    <button class="thumb-nav-btn" id="btn-nav-next" title="Next Page or Chapter">
      <span class="btn-text">NEXT</span>
      <span class="btn-arrow">&gt;</span>
    </button>
  </footer>

  <script type="module" src="./app.js"></script>
</body>
</html>
